<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semnal tăcut</title>
<link rel="stylesheet" href="style.css">
<style>
  .go{max-width:640px;margin:12vh auto 0;text-align:center;border:1px solid var(--hull);
    border-left:3px solid var(--err);border-radius:12px;background:var(--panel);padding:40px 30px}
  .go .sub{color:var(--err);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
  .go h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:46px;letter-spacing:.05em;margin:8px 0 16px}
  .go h1 em{color:var(--err);font-style:normal}
  .go p{color:var(--ink);font-size:14px;margin-bottom:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="go enter">
    <div class="sub">Oxigen epuizat</div>
    <h1>SEMNAL <em>TĂCUT</em></h1>
    <p>Rezervorul e gol. Nava plutește tăcută spre marginea sistemului solar.
       Poate data viitoare, cadet.</p>
    <button class="btn" style="max-width:240px;margin:0 auto" onclick="location.href='index.html'">↺ Reîncearcă</button>
  </div>
</div>
</body>
</html>
